name: CLEF
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - transformers>=4.50,<5
      - datasets>=3.0
      - tokenizers>=0.20
      - accelerate>=1.0
      - scikit-learn>=1.4
      - pandas>=2.2
      - numpy>=1.26
      - tqdm
      - pyyaml
